[package]
name = "netatlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Linux-first network discovery, identification, and diagnostics"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
csv = "1.4.0"
futures-util = "0.3.31"
hickory-resolver = "0.26.3"
ipnet = { version = "2.12.2", features = ["serde"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rtnetlink = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
surge-ping = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["serde", "v7"] }
mdns-sd = "0.21.7"
roxmltree = "0.21.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
